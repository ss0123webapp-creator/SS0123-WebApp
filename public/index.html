<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>SS0123 Web App</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0b1220;
      color: #fff;
    }

    .box {
      max-width: 520px;
      margin: auto;
      background: #121c2f;
      padding: 22px;
      border-radius: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .small {
      opacity: .75;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>SS0123 Web App</h2>

    <p>
      Before continuing, please know what will be shared.
    </p>

    <p class="small">
      Your location is shared only after you press
      Share Location and allow location permission.
    </p>

    <button id="locBtn">
      📍 Share Location
    </button>

    <div id="status" class="small"></div>

  </div>


  <script>

    const tg = window.Telegram?.WebApp;

    tg?.ready();
    tg?.expand();


    const locBtn =
      document.getElementById("locBtn");

    const statusEl =
      document.getElementById("status");


    function status(message) {
      statusEl.textContent = message;
    }


    locBtn.onclick = () => {

      if (!navigator.geolocation) {

        status(
          "Location is not supported by this browser."
        );

        return;
      }


      status(
        "Requesting location permission…"
      );


      navigator.geolocation.getCurrentPosition(

        async position => {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          status(
            `Location found:\n${latitude}, ${longitude}\nAccuracy: ${Math.round(accuracy)} m`
          );


          try {

            const response =
              await fetch(
                "/api/location",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    latitude,
                    longitude,
                    accuracy
                  })
                }
              );


            const result =
              await response.json();


            if (!result.ok) {
              throw new Error(
                result.error || "Failed"
              );
            }


            status(
              "✅ Location sent to Telegram."
            );

          } catch (error) {

            status(
              "Location found, but sending failed."
            );

          }

        },


        error => {

          if (error.code === 1) {

            status(
              "Location permission denied. Please allow location access."
            );

          } else if (error.code === 2) {

            status(
              "Location is OFF or unavailable. Please turn on Location and try again."
            );

          } else if (error.code === 3) {

            status(
              "Location request timed out. Please try again."
            );

          } else {

            status(
              "Unable to get location. Please try again."
            );

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    };

  </script>

</body>
</html>
